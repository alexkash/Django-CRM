components:
  schemas:
    APISettingsList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        apikey:
          type: string
          maxLength: 64
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          $ref: '#/components/schemas/User'
        lead_assigned_to:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
        tags:
          type: array
          items: {}
          readOnly: true
        org:
          $ref: '#/components/schemas/Organization'
      required:
      - created_at
      - created_by
      - id
      - lead_assigned_to
      - org
      - tags
      - title
    APISettingsSwaggerRequest:
      type: object
      description: |-
        The request body `common/views/settings_views.py` actually reads.

        A ModelSerializer here documented both relations as lists of ids, while the
        views have always taken `tags` as names. Written out by hand so the schema
        says what the endpoint does. On PATCH every field is optional, and an
        absent `tags` or `lead_assigned_to` is left unchanged.
      properties:
        title:
          type: string
          minLength: 1
        website:
          type: string
          format: uri
          minLength: 1
          maxLength: 255
        tags:
          type: array
          items:
            type: string
            minLength: 1
          description: Tag NAMES, not ids. Each is matched by slug within the caller's
            org and created there if the org has none by that name.
        lead_assigned_to:
          type: array
          items:
            type: string
            format: uuid
          description: Profile ids. Each must be an active member of the caller's
            org, or the request is refused with a 400.
      required:
      - title
      - website
    Account:
      type: object
      description: Serializer for reading Account data
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legal_name:
          type: string
          maxLength: 255
        registration_code:
          type: string
          maxLength: 10
        vat_registration_number:
          type: string
          maxLength: 30
        legal_address:
          type: string
          maxLength: 500
        iban:
          type: string
          maxLength: 29
        bank_name:
          type: string
          maxLength: 255
        mfo:
          type: string
          maxLength: 6
        tax_system_text:
          type: string
          maxLength: 500
        signer_name:
          type: string
          maxLength: 255
        signer_title:
          type: string
          maxLength: 150
        name:
          type: string
          title: Account Name
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^[\d\s\-\(\)\+\.]{7,25}$
            maxLength: 25
          - type: string
            maxLength: 0
        website:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        industry:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/IndustryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        number_of_employees:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        annual_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
        currency:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        address_line:
          type: string
          nullable: true
          title: Address
          maxLength: 255
        city:
          type: string
          nullable: true
          maxLength: 255
        state:
          type: string
          nullable: true
          maxLength: 255
        postcode:
          type: string
          nullable: true
          title: Postal Code
          maxLength: 64
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ClientCountryEnum'
