    PatchedOpportunityMoveRequest:
      type: object
      description: |-
        Payload for PATCH /opportunities/<pk>/move/.

        `column_id` is the id the board GET handed the client for the destination
        column, which for opportunities is a stage `code` of the deal's own
        pipeline (the view checks it against that pipeline). Boards for leads,
        cases and tasks take the same field name and put a stage UUID or a status
        value in it, so one client component drives all four.

        `above_id`/`below_id` name the cards the drop landed between; either, both,
        or neither may be sent. An explicit `kanban_order` wins over both.
      properties:
        column_id:
          type: string
          minLength: 1
          maxLength: 64
        kanban_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,6})?$
        above_id:
          type: string
          format: uuid
          nullable: true
        below_id:
          type: string
          format: uuid
          nullable: true
    PatchedOrganizationRequest:
      type: object
      description: |-
        Public org representation, nested into most CRM records.

        `api_key` is deliberately excluded: it authenticates its bearer as the
        org's first ADMIN profile (see `common.external_auth.APIKeyAuthentication`),
        so including it here would hand every org member -- including role="USER"
        -- a path to admin. Admins read and rotate it via `OrgApiKeyView`.
      properties:
        name:
          type: string
          nullable: true
          maxLength: 100
    PatchedProfileSelfUpdateRequest:
      type: object
      description: |-
        The two fields a user may change on their OWN profile via PATCH /api/profile/.

        Deliberately just ``phone`` (on Profile) and ``name`` (on User). Role, org
        and the ``has_*_access`` flags are NOT here:
        those decide permissions and are an admin's to set. Leaving them out is what
        keeps this self-edit endpoint from becoming the same self-serve privilege
        escalation ``CreateProfileSerializer`` once was. A field the serializer does
        not name cannot be written, no matter what the request body contains.

        ``phone`` is validated (not written raw as the view used to), so a bad value
        is a clean 400 instead of an unvalidated string in the column. A blank phone
        is allowed and clears it, ``allow_blank`` short-circuits before the regex,
        which requires 7-25 characters.
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          oneOf:
          - type: string
            pattern: ^[\d\s\-\(\)\+\.]{7,25}$
            maxLength: 20
          - type: string
            maxLength: 0
    PatchedSavedViewRequest:
      type: object
      description: |-
        One saved view, as its owner reads and writes it.

        ``org`` and ``profile`` are set by the view from the request, and a body
        naming either is refused rather than ignored. ``module`` is fixed once the
        view exists: a view's filters only mean something to the list they came
        from.
      properties:
        module:
          $ref: '#/components/schemas/ModuleEnum'
        name:
          type: string
          minLength: 1
          maxLength: 100
        filters: {}
