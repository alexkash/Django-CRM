        ``template_html`` / ``template_css`` are org-authored HTML/CSS that
        WeasyPrint renders into a PDF server-side. The moment either reaches a
        browser DOM (an accidental ``{@html}``) a PDF setting becomes stored XSS, so
        they are kept off every list/detail/create/nested response. Callers get
        booleans and a byte count describing the markup, never the markup itself.
        This is the serializer every read path uses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Template Name
          maxLength: 100
        is_default:
          type: boolean
        primary_color:
          type: string
          maxLength: 7
        secondary_color:
          type: string
          maxLength: 7
        has_logo:
          type: string
          readOnly: true
        has_custom_html:
          type: string
          readOnly: true
        has_custom_css:
          type: string
          readOnly: true
        custom_html_bytes:
          type: string
          readOnly: true
        default_notes:
          type: string
        default_terms:
          type: string
        footer_text:
          type: string
        used_on_invoices:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        updated_by:
          type: string
          readOnly: true
      required:
      - created_at
      - custom_html_bytes
      - has_custom_css
      - has_custom_html
      - has_logo
      - id
      - name
      - updated_at
      - updated_by
      - used_on_invoices
