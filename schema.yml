    Comment:
      type: object
      description: Serializer for Comment model using ContentType
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        comment:
          type: string
          maxLength: 10000
        commented_on:
          type: string
          format: date-time
          readOnly: true
        commented_by:
          allOf:
          - $ref: '#/components/schemas/CommentUser'
          readOnly: true
        commented_by_contact:
          allOf:
          - $ref: '#/components/schemas/CommentContact'
          readOnly: true
        content_type:
          type: string
          title: Python model class name
          readOnly: true
        object_id:
          type: string
          format: uuid
          readOnly: true
        org:
          type: string
          format: uuid
          readOnly: true
        is_internal:
          type: boolean
      required:
      - comment
      - commented_by
      - commented_by_contact
      - commented_on
      - content_type
      - id
      - object_id
      - org
    CommentContact:
      type: object
      description: |-
        The customer who wrote a portal reply.

        Name and email only. An agent reading the thread needs to know which person
        at the account is talking to them; the rest of the contact record is a click
        away and does not belong inline in a comment.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - name
    CommentUser:
      type: object
      description: Simplified user serializer for comments
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_details:
          type: string
          readOnly: true
      required:
      - id
      - user_details
    Contact:
      type: object
      description: Serializer for reading Contact data
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^[\d\s\-\(\)\+\.]{7,25}$
            maxLength: 25
          - type: string
            maxLength: 0
        organization:
          type: string
          nullable: true
          title: Company
          maxLength: 255
        title:
          type: string
          nullable: true
          title: Job Title
          maxLength: 255
        department:
          type: string
          nullable: true
          maxLength: 255
        do_not_call:
          type: boolean
        linkedin_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        address_line:
          type: string
          nullable: true
          title: Address
          maxLength: 255
        city:
          type: string
          nullable: true
          maxLength: 255
        state:
          type: string
          nullable: true
          maxLength: 255
        postcode:
          type: string
          nullable: true
          title: Postal Code
          maxLength: 64
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ClientCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        assigned_to:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Teams'
          readOnly: true
        tags:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
          nullable: true
          title: Notes
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        is_active:
          type: boolean
        org:
          $ref: '#/components/schemas/Organization'
        account:
          type: string
          format: uuid
          nullable: true
          description: Primary account this contact belongs to
        account_detail:
          type: object
          additionalProperties: {}
          description: |-
            The `account` FK, resolved to something a page can print.

            The bare field is a UUID, so every caller that wanted to show which
            company somebody works for had to either fetch the account separately
            or fall back to `organization` -- which is free text and is frequently
            a *different* company from the linked one.
          readOnly: true
        linked_accounts:
          type: array
          items: {}
          description: |-
            Membership of `Account.contacts`, which is the other account link.

            A Contact is joined to an Account twice over: this many-to-many, and
            the `account` FK the model calls "primary". They are independent, and
            in practice it is this one that carries the data -- the accounts page
            builds its people list from it. A caller that reads only the FK shows
            nobody an account; one that reads only the M2M cannot say which of two
            or three is the main one. Both are published so the choice is the
            reader's and is made in the open.
          readOnly: true
        contact_attachment:
          type: array
          items:
            $ref: '#/components/schemas/Attachments'
          readOnly: true
        custom_fields:
          description: Per-org schema extension; values are validated against common.CustomFieldDefinition.
      required:
      - account_detail
      - assigned_to
      - contact_attachment
      - created_at
      - first_name
      - id
      - last_name
      - linked_accounts
      - org
      - teams
      - updated_at
