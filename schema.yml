    SolutionDetail:
      type: object
      description: Detailed serializer for solution with linked cases
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SolutionStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        org:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tags'
          readOnly: true
        linked_cases:
          type: array
          items: {}
          description: |-
            Linked tickets the *requester* is allowed to open.

            This used to be `CaseSerializer(obj.cases.all()[:10], many=True)`,
            the full 33-field case payload, with no access check of any kind. A
            member of the org refused a case with a 403 could link an article to
            that very case (the link endpoint checked org and nothing else) and
            then read the case's name, description, account and contacts back
            through here. Proven end to end against the running server: 403 on the
            case, 201 on the link, the case's contents in the article.

            So: filtered through the same `visible_cases_qs` the queue and the case
            detail use, and slimmed to what a rail of links actually needs.

            `case_count` stays the *total*. It is the honest usage figure for an
            article and is already public on the list endpoint, so a reader seeing
            fewer rows than the count is being told plainly that some of those
            tickets are not theirs, rather than shown a number that quietly means
            something different for each reader.
          readOnly: true
        case_count:
          type: integer
          readOnly: true
        author:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: Last Modified By
        can_edit:
          type: boolean
          description: |-
            The `write` rule in `cases.kb_access`, for the requester, so a client
            offers Edit only when the save would be accepted. False without a
            profile in context: nobody known, nothing offered.
          readOnly: true
        can_delete:
          type: boolean
          description: The `delete` rule in `cases.kb_access`, for the requester.
          readOnly: true
      required:
      - author
      - can_delete
      - can_edit
      - case_count
      - created_at
      - created_by
      - description
      - id
      - is_published
      - linked_cases
      - org
      - status
      - tags
      - title
      - updated_at
      - updated_by
